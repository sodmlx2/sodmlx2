<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodmlx2 | Root Shell Blog</title>
    <style>
        body {
            background-color: #000;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.15;
        }

        .terminal {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ff41;
            width: 90%;
            max-width: 900px;
            height: 80vh; /* Altura fixa para parecer um console */
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative;
            overflow-y: auto; /* Scroll interno caso o blog cresça */
        }

        /* Custom Scrollbar para manter o estilo */
        .terminal::-webkit-scrollbar { width: 8px; }
        .terminal::-webkit-scrollbar-thumb { background: #00ff41; }

        h1 { font-size: 1.4rem; border-bottom: 2px solid #00ff41; padding-bottom: 10px; }
        h2 { font-size: 1.1rem; color: #fff; margin-top: 30px; text-transform: uppercase; }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .post-link {
            border: 1px dashed #00ff41;
            padding: 10px;
            display: block;
            color: #00ff41;
            text-decoration: none;
            transition: 0.3s;
        }

        .post-link:hover {
            background: #00ff41;
            color: #000;
            font-weight: bold;
        }

        .status-bar {
            background: #00ff41;
            color: #000;
            padding: 2px 10px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 0.8rem;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* Efeito de Scanline */
        .terminal::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="terminal">
        <header>
            </header>

     

        <footer style="margin-top: 50px; border-top: 1px solid #444; padding-top: 10px; font-size: 0.8rem; color: #666;">
            EOF - End Of File
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        setInterval(draw, 33);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
