<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodmlx2 | Root Shell</title>
    <style>
        body {
            background-color: #000;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Fundo Matrix */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.2;
        }

        .terminal {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff41;
            width: 90%;
            max-width: 800px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative;
        }

        h1, h2, h3 {
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 { font-size: 1.2rem; margin-bottom: 30px; }
        h3 { font-size: 1rem; color: #fff; border-bottom: 1px solid #00ff41; display: inline-block; margin-top: 25px; }

        .list {
            list-style: none;
            padding: 0;
        }

        .list li {
            margin: 12px 0;
            display: flex;
            align-items: center;
        }

        .list li::before {
            content: "> ";
            margin-right: 10px;
        }

        a {
            color: #00ff41;
            text-decoration: none;
            transition: all 0.3s;
        }

        a:hover {
            background: #00ff41;
            color: #000;
            padding: 0 5px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Scanline effect */
        .terminal::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="terminal">
        <header>
            <h1>[ SODMLX2@GITHUB-IO ] <span class="blink">_</span></h1>
            <p>Connection established: SSH-2.0-OpenSSH_8.2p1</p>
        </header>

        <section>
            <h3>### Projects</h3>
            <ul class="list">
                <li>🔥 <a href="https://github.com/sodmlx2/armx-tool" target="_blank">armx-tool</a></li>
                <li>🔥 <a href="https://github.com/sodmlx2/interp-comp" target="_blank">interp-comp</a></li>
            </ul>

            <h3>### Contributions</h3>
            <ul class="list">
                <li>🔥 <a href="https://fosstrak.github.io/epcis/team-list.html" target="_blank">EPCIS Team List</a></li>
            </ul>

            <h3>### Community</h3>
            <ul class="list">
                <li>🔥 <a href="https://sodmlx2.github.io/cora-hackerspace" target="_blank">Cora Hackerspace</a></li>
            </ul>
        </section>

        <footer style="margin-top: 40px; font-size: 0.7rem; color: #444;">
            [SYSTEM READY] - UNKNOWN_USER LOGGED IN
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('center') || canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
